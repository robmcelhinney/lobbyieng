name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - name: Install Python deps
        run: uv sync --frozen

      - name: Python syntax + import safety (parser must not wipe DB on import)
        run: |
          uv run python -m compileall -q parser.py scripts download-oireachtas-images.py
          uv run python -c "import parser; assert parser.engine is None and parser.Session is None"

      - name: Install JS deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build DB from empty data (pipeline smoke test)
        run: |
          mkdir -p data
          uv run python parser.py

      - name: Production build
        run: npm run build
